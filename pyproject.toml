[project]
name = "winbolo-ml"
version = "0.1.0"
description = "A starting point for training WinBolo agents with reinforcement learning"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.0",
    "numpy>=1.24",
    "tensorboard>=2.14",
    "pyyaml>=6.0",
    "onnx",
    "onnxscript",
]

[project.optional-dependencies]
export = ["onnxruntime"]
dev = ["pytest"]
[tool.setuptools.packages.find]
include = ["winbolo_ml*"]
