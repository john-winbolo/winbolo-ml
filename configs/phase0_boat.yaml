env:
  map: "maps/phase0_boat.map"
  max_ticks: 1000
  game_type: 3
  end_on_all_pillbox_captures: false
  end_on_land: true

training:
  total_timesteps: 5_000_000
  num_envs: 32
  learning_rate: 0.0003
  n_steps: 4096
  batch_size: 4096
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  action_mask: [true, true, false, false, false, false, false, false]

rewards:
  phase: phase1_movement
  overrides:
    survival_tick: 0.005
    idle_penalty: -0.01
    boat_overstay: -0.005
    on_land_bonus: 0.05

network:
  encoder_dim: 64
  hidden_dim: 256
