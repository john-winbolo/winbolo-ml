env:
  map: "maps/phase1-1_base.map"
  max_ticks: 1200
  game_type: 3

training:
  total_timesteps: 20_000_000
  num_envs: 64
  learning_rate: 0.0003
  n_steps: 4096
  batch_size: 4096
  n_epochs: 3
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  action_mask: [true, true, false, false, false, false, false, false]

rewards:
  phase: phase1_movement
  overrides:
    survival_tick: 0.0
    exploration_bonus: 0.0
    speed_bonus: 0.0
    base_proximity: 0.05
    base_captured: 50.0
    idle_penalty: -0.01

network:
  encoder_dim: 64
  hidden_dim: 256
